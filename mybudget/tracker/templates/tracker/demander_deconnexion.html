{% extends 'tracker/base.html' %}

{% block content %}
<!-- MODIFICATION : Utilisation de notre classe de centrage étroite existante -->
<div class="carte zone-formulaire-etroit">
    <h2 style="margin-top: 0; color: var(--texte);">Souhaitez-vous vraiment vous déconnecter ?</h2>

    <p style="color: var(--discret); margin-bottom: var(--m);">Vous allez fermer votre session active sur MonBudget.</p>

    <form method="post" action="{% url 'deconnexion' %}">
        {% csrf_token %}
        
        <!-- Réutilisation de notre classe de bouton rouge destructif existant (.btn-depense) -->
        <input type="submit" class="btn-action btn-depense" style="width: 100%; padding: var(--s);" value="Oui, me déconnecter">
    </form>

    <!-- MODIFICATION : Remplacement du <hr> par un bouton d'annulation gris propre (.btn-mixte) -->
    <div style="margin-top: var(--s); text-align: center;">
        <a href="{% url 'accueil' %}" class="btn-action btn-mixte" style="display: block; padding: var(--s);">
            Non, repartir dans l'accueil
        </a>
    </div>
</div>
{% endblock %}
