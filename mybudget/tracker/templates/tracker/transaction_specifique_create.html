{% extends 'tracker/base.html' %}
{% load static %}

{% block content %}


<div class="carte zone-formulaire">
  <h1> {{ titre }} </h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="text-align: right; margin-top: calc(-1 * var(--xs)); margin-bottom: var(--s);">
        <button type="button" class="btn-action {% if type_action == 'revenu' %}btn-revenu{% else %}btn-depense{% endif %}" id="ouvrir-modale" style="padding: var(--xs) var(--s); font-size: 0.85em;">
            + Créer une catégorie de {% if type_action == 'revenu' %}revenu{% else %}dépense{% endif %}
        </button>
    </div>
    <input type="submit" class="bouton-valider {% if type_action == 'revenu' %}btn-revenu{% else %}btn-depense{% endif %}" 
           value="Enregistrer la transaction">
  </form>
  <p><a href="{% url 'accueil' %}" class="lien-annuler">Annuler et retourner à l'accueil</a></p>
</div>

<!-- ==========================================================================
     LA FENÊTRE MODALE UNIQUE ET UNIFIÉE (Invisible par défaut)
     ========================================================================== -->
<div class="modale-arriere-plan" id="ma-modale" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(28, 36, 48, 0.6); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modale-contenu" style="background-color: var(--surface); padding: var(--m); border-radius: var(--rayon); width: 90%; max-width: 400px; box-shadow: var(--ombre);">
        
        <!-- Le titre interne de la pop-up sera réécrit proprement par le JavaScript -->
        <h3 style="margin-top: 0;" id="modale-titre">Nouvelle catégorie</h3>
        <p style="color: var(--discret); font-size: 0.9em;">Elle sera ajoutée instantanément à votre liste déroulante.</p>
        
        <input type="text" id="nouveau-nom-cat" style="width: 100%; padding: var(--xs) var(--s); margin: var(--s) 0; border: 1px solid #E2E8F0; border-radius: var(--rayon); box-sizing: border-box; background-color: var(--fond);" placeholder="Ex: Salaire, Loyer, Restaurant...">
        
        <div style="display: flex; justify-content: flex-end; gap: var(--s); margin-top: var(--m);">
            <button type="button" id="fermer-modale" style="background: none; border: none; color: var(--discret); cursor: pointer; font-weight: 500;">Annuler</button>
            
            <!-- PASSERELLE DE SÉCURITÉ : Transmission de l'URL de l'API et du Token anti-fraude CSRF au fichier JS -->
            <button type="button" id="valider-categorie" class="btn-action"
                    data-url="{% url 'api-categorie-create' %}"
                    data-csrf="{{ csrf_token }}">
                Créer la catégorie
            </button>
        </div>
    </div>
</div>

{% endblock %}

{% block javascript %}
    <script src="{% static 'tracker/gestion_categories.js' %}"></script>
{% endblock %}
